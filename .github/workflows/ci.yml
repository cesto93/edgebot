name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          # Keep in sync with the `go` directive in go.mod (1.27.0).
          go-version: '1.27.x'

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Check go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest

      - name: Shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck scripts/*.sh docker-entrypoint.sh

      - name: Vulnerability check
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
          go-package: ./...

      - name: Build
        run: go build -o edgebot .

      - name: Run tests with race detector and coverage
        run: go test -race -shuffle=on -coverprofile=coverage.out ./...

      - name: Allowlist fuzz smoke test
        run: go test -run XXX -fuzz FuzzIsAllowedCommand -fuzztime=10s ./config

      - name: Check coverage floor
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | tr -d '%')
          echo "### Coverage: ${COVERAGE}%" >> "$GITHUB_STEP_SUMMARY"
          # Ratchet, not a goal: fail only when coverage regresses.
          if awk "BEGIN {exit !($COVERAGE < 45)}"; then
            echo "Coverage ${COVERAGE}% is below the 45% floor"
            exit 1
          fi

      - name: Check for copy-paste duplication
        run: npx --yes jscpd@4 .
