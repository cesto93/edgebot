services:
  edgebot-bot:
    image: ghcr.io/cesto93/edgebot:latest
    build: .
    container_name: edgebot-bot
    command: ["bot"]
    restart: unless-stopped
    working_dir: /workspace
    volumes:
      - .:/workspace
      # Persist config, usage stats, KV store and model/lib caches
      - edgebot-config:/root/.config/edgebot
      - edgebot-data:/root/.edgebot
    env_file:
      - .env
    environment:
      # Provider/model selection: explicit env overrides win over config.yaml
      # (see LoadConfig/applyEnvOverrides). This compose stack runs the
      # in-process litertlm provider with Gemma 4 E2B-IT by default.
      - LLM_PROVIDER=litertlm
      - LLM_MODEL=gemma-4-E2B-it
      # The entrypoint downloads libs + model if missing and persists these
      # values to the config on startup.
      - LITERTLM_BACKEND=cpu
      - LITERTLM_MODEL_REPO=litert-community/gemma-4-E2B-it-litert-lm
      - LITERTLM_MODEL_FILE=gemma-4-E2B-it.litertlm

volumes:
  edgebot-config:
  edgebot-data:
